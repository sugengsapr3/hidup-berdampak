{% extends "base.html" %}
{% block title %}Login | HIDUP. BERDAMPAK{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card">
      <h1 style="font-size:1.7rem; text-align:center; margin-bottom:8px;">Masuk</h1>
      <p style="color:var(--muted); text-align:center; margin-bottom:24px;">
        Masuk untuk mengakses konten dan sumber dayamu.
      </p>
      <form method="get" action="{{ url_for('login') }}">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Masuk</button>
      </form>
      <p style="color:var(--muted); text-align:center; margin-top:18px; font-size:.9rem;">
        Belum bergabung?
        <a href="{{ url_for('join') }}" class="link-arrow">Bergabung</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
